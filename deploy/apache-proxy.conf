# پراکسی معکوس cPanel به برنامه‌ی Node (Apache یا LiteSpeed)
# این فایل را در هر دو مسیر زیر بگذارید (DOMAIN و CPANEL_USER را جایگزین کنید):
#   /etc/apache2/conf.d/userdata/std/2_4/CPANEL_USER/DOMAIN/soozanban.conf
#   /etc/apache2/conf.d/userdata/ssl/2_4/CPANEL_USER/DOMAIN/soozanban.conf
# سپس: /scripts/rebuildhttpdconf && /scripts/restartsrv_httpd
# (اگر LiteSpeed دارید، بعد از آن LiteSpeed را هم graceful restart کنید)

ProxyPreserveHost On
ProxyRequests Off
# گواهی AutoSSL در مسیر .well-known نباید به Node برود
ProxyPass /.well-known/ !
ProxyPass / http://127.0.0.1:3700/ retry=0 timeout=30
ProxyPassReverse / http://127.0.0.1:3700/
RequestHeader set X-Forwarded-Proto "https" env=HTTPS
